# ----------------------------------------
# Here we define the services we want to run
# in addition to the base, administrative
# services defined in the base compose file.
# ----------------------------------------
include:
  - services/dashy.yml
  - services/obsidian.yml
  - services/portainer.yml
  # - services/samba.yml
  - services/mealie.yml
  # - services/backrest.yml
  - services/actual.yml
  - services/paperless.yml
  # - services/n8n.yml
  # - services/expenseowl.yml
  # Monitoring and observability stack
  - services/monitoring.yml
  - services/uptime-kuma.yml
  - services/homepage.yml
  - services/scrutiny.yml
  - services/nextcloud.yml

services:
  traefik:
    image: "traefik:v3.3"
    container_name: "traefik"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      # This is the main Traefik configuration file.
      - "./conf/traefik.yml:/etc/traefik/traefik.yml:ro"

      # This is the Docker socket. It gives Traefik
      # access to the Docker API so it can automatically
      # discover new containers and configure itself.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

      # This is where the logs for Traefik will go
      # It's nice to have them seperated because they
      # contain an access log of all requests
      - "./traefik-logs:/logs"
      
      # Mount the TLS certificates for Traefik to use
      # HTTPS. These can be regenerated by using 
      # ./scripts/update_tls_certs.sh
      - "./certs:/certs:ro"
      - "./certs/certs.yml:/etc/traefik/certs.yml:ro"
    networks:
      - belvale

networks:
  belvale:
    external: true
