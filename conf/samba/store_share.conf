# General-purpose browsable share on the 8TB drive (/srv/store/share),
# identical in style to the pre-existing [belvale_2tb] share on /media/med_2tb.
# Deploy: see conf/samba/README.md / scripts/install_host_config.sh

[share]
   path = /srv/store/share
   browseable = yes
   writable = yes
   guest ok = yes
   force user = chris
