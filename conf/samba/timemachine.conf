# Time Machine share for the native Samba (smbd) install.
#
# Deploy:
#   sudo install -m 0644 conf/samba/timemachine.conf /etc/samba/timemachine.conf
#   # then add this line inside the [global] section of /etc/samba/smb.conf:
#   #     include = /etc/samba/timemachine.conf
#   sudo testparm -s && sudo systemctl reload smbd
#
# Backing store: /srv/store/timemachine  (ext4, on the 8 TB drive -> srv-store.mount)
# Dedicated user: tm  (system account, smbpasswd-managed; password in 1Password)

[global]
   # macOS / SMB interop (vfs_fruit). Safe to apply globally; only affects
   # Apple clients. Needed for Time Machine and for clean .DS_Store / metadata
   # handling on the other shares too.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = TimeCapsule8,119
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:zero_file_id = yes
   spotlight = no

[timemachine]
   comment = Time Machine (%h)
   path = /srv/store/timemachine
   valid users = tm
   write list = tm
   read only = no
   browseable = yes
   inherit permissions = yes
   create mask = 0600
   directory mask = 0700
   # Advertise as a Time Machine target and cap the sparsebundle so it can't
   # eat the whole 7.3 TB volume. Raise/lower to taste (2-3x the Mac's disk).
   fruit:time machine = yes
   fruit:time machine max size = 2T
