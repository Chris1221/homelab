---
# Styled as the house nameplate in custom.css
- greeting:
    text_size: xl
    text: Belvale

- datetime:
    text_size: xl
    format:
      timeStyle: short
      dateStyle: full
      hourCycle: h23

- search:
    provider: google
    target: _blank
    focus: true

- resources:
    backend: resources
    expanded: true
    cpu: true
    memory: true
    disk: /
    uptime: true
    units: metric
    refresh: 3000

- openmeteo:
    label: Toronto
    latitude: 43.65
    longitude: -79.38
    units: metric
    cache: 5
