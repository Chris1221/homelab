---
- Data and Storage:
    - Immich:
        icon: immich.png
        href: http://lab.chrisbcole.me:2283
        description: Photo library and backup
        siteMonitor: http://immich-server:2283
        widget:
          type: immich
          url: http://immich-server:2283
          version: 2
          key: {{HOMEPAGE_VAR_IMMICH_API_KEY}}

    - CouchDB:
        icon: couchdb.png
        href: http://lab.chrisbcole.me:5984/_utils
        description: Document database for Obsidian sync
        siteMonitor: http://obsidian-livesync:5984

    - Backrest:
        icon: backrest.png
        href: http://lab.chrisbcole.me:9898
        description: Restic backup interface with scheduling
        siteMonitor: http://backrest:9898

    - Backups:
        icon: mdi-shield-check
        href: https://backups.lab.chrisbcole.me
        description: Are the off-site and local backups healthy?
        siteMonitor: http://backup-status:8080/healthz
        widget:
          type: customapi
          url: http://backup-status:8080/api/status
          refreshInterval: 60000
          mappings:
            - field: level
              label: Status
              remap:
                - value: ok
                  to: Healthy
                - value: warn
                  to: Warning
                - value: fail
                  to: Failing
            - field:
                checks:
                  offsite: last_success
              label: Off-site
              format: relativeDate
            # Local status rather than its date: before the first local
            # backup finishes the date is null, which renders as 1970.
            - field:
                checks:
                  local: level
              label: Local
              remap:
                - value: ok
                  to: Healthy
                - value: warn
                  to: Running
                - value: fail
                  to: Failing

