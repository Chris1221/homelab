---
title: Belvale Homelab
favicon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homepage.png

# Theme options: dark, light
theme: dark

# Color options: slate, gray, zinc, neutral, stone, amber, yellow, lime, green, emerald, teal, cyan, sky, blue, indigo, violet, purple, fuchsia, pink, rose, red, orange
color: slate  # retinted to the Belvale palette in custom.css

# Header style: clean, boxed, underlined
headerStyle: clean

# Layout style: fixed (default) or fluid
layout:
  Data and Storage:
    style: row
    columns: 3
    icon: mdi-database
  Home:
    style: row
    columns: 3
    icon: mdi-home
  Admin:
    style: row
    columns: 3
    icon: mdi-cog
  Monitoring:
    style: row
    columns: 3
    icon: mdi-chart-line

# Hide errors
hideErrors: false

# Show stats
showStats: true

# Card layout
statusStyle: dot

# Quick launch
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false
  hideVisitURL: false
