log:
  level: INFO
  # level: DEBUG

api:
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false

  file:
    filename: /etc/traefik/certs.yml

accessLog:
  filePath: /logs/access.log

