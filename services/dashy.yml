services:
  dashy:
    image: lissy93/dashy
    container_name: Dashy
    volumes:
      - ../conf/dashy.yml:/app/user-data/conf.yml
    environment:
      - NODE_ENV=production
      - UID=1000
      - GID=1000
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD', 'node', '/app/services/healthcheck' ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      
      - "traefik.http.routers.dashy.rule=Host(`${DOMAIN}`)"
      # - "traefik.http.routers.dashy.entrypoints=web"
      # - "traefik.http.services.dashy.loadbalancer.server.port=80"

      # Use HTTPS
      - "traefik.http.routers.dashy.entrypoints=websecure"
      - "traefik.http.routers.dashy.tls=true"

      # Forward traffic to Dashy’s internal port
      - "traefik.http.services.dashy.loadbalancer.server.port=8080"


      # Were not commented
      # - "traefik.http.routers.dashy.entrypoints=web"
      # - "traefik.http.services.dashy.loadbalancer.server.port=8080"
      
      # Were commented
      # - "traefik.http.middlewares.strip-dashy.stripprefix.prefixes=/"
      # - "traefik.http.routers.dashy.middlewares=strip-dashy"
    networks:
      - belvale
