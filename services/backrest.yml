# See e170651 for context.

version: "3.8"
services:
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    volumes:
      - ./backrest/data:/data
      - ./backrest/config:/config
      - ./backrest/cache:/cache
      - ./backrest/tmp:/tmp
      - ${HOME}/.config/gcloud:/gcloud  # Mount gcloud credentials
      - /media/med_2tb:/userdata  # Mount local paths to backup
      - /srv/store/restic:/repos/local  # Local restic repo on the 8TB drive
      # - /path/to/local/repos:/repos     # Mount local repos (optional for remote storage)
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=America/Los_Angeles
      - GOOGLE_APPLICATION_CREDENTIALS=/gcloud/backrest-sa.json  # restic SA key (managed by infra/ terraform)
    ports:
      - "9898:9898"
    restart: unless-stopped